<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/disc.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Chakra+Petch:wght@500&family=Manrope:wght@200;400;500;600&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <title>BC-1 + KO Sidekick</title>
    <meta name="description" content="A CD player and mixer for the browser. Burn discs from YouTube, SoundCloud, Spotify and your own files." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cds.bruceblay.com/" />
    <meta property="og:title" content="BC-1 + KO Sidekick" />
    <meta property="og:description" content="A CD player and mixer for the browser. Burn discs from YouTube, SoundCloud, Spotify and your own files." />
    <meta property="og:image" content="https://cds.bruceblay.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two CD players with printed discs and a two-channel mixer, patched together with cables" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cds.bruceblay.com/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Loading screen: shown before any script loads, filled by the app as its code and textures arrive -->
    <div id="boot" role="progressbar" aria-label="loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="boot-name">BC-1 + KO Sidekick</div>
      <div class="boot-track"><div class="boot-fill"></div></div>
      <div class="boot-pct">0%</div>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: radial-gradient(70% 60% at 50% 42%, #f2f0eb, transparent 70%), #e6e3dc;
        color: #232321;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      .boot-name { font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
      .boot-track { width: 180px; height: 2px; background: rgb(35 35 33 / 0.12); overflow: hidden; }
      .boot-fill { width: 100%; height: 100%; background: #ff5a1f; transform: scaleX(0); transform-origin: left; }
      .boot-pct { font-size: 11px; color: #6f6c65; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
    </style>
    <script>
      ;(() => {
        const el = document.getElementById('boot')
        const fill = el.querySelector('.boot-fill')
        const pct = el.querySelector('.boot-pct')
        let shown = 0
        let target = 0
        let finished = false
        // until the app reports in, ease towards 45% while its code downloads
        const tick = setInterval(() => {
          if (!finished && target < 0.45) target += (0.45 - target) * 0.04
          shown += (target - shown) * 0.25
          if (finished && shown > 0.995) shown = 1
          fill.style.transform = `scaleX(${shown})`
          const n = Math.round(shown * 100)
          pct.textContent = n + '%'
          el.setAttribute('aria-valuenow', String(n))
          if (finished && shown === 1) {
            clearInterval(tick)
            el.classList.add('gone')
            setTimeout(() => el.remove(), 400)
          }
        }, 40)
        window.__boot = {
          set(p) { target = Math.max(target, Math.min(0.98, p)) },
          done() { finished = true; target = 1 },
        }
        // never hold the page hostage if something stalls
        setTimeout(() => window.__boot.done(), 20000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
